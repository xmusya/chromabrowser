[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromabrowser"
version = "1.0.0"
description = "ChromaBrowser - a colorful browser for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChromaBrowser" }]
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyte>=0.8"]

[project.scripts]
chroma = "chromabrowser.cli:main"
chromabrowser = "chromabrowser.cli:main"

[tool.setuptools.packages.find]
include = ["chromabrowser*"]
